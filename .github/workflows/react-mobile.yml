name: React Native mobile

# `quality` fills the gap docs/build-plan.md's Phase 4 (Assignment 5) already
# promised ("CI job added for RN lint + test") but never actually landed —
# apps/react-mobile had no dedicated workflow until this file. `e2e` is the
# docs/accessibility/mobile-audit.md next step: Maestro flows behind a
# `run-e2e` label, mirroring how ci.yml gates the web app's Playwright suite,
# per the reasoning in docs/TESTING.md (an emulator boot is even heavier than
# a browser, so it stays off the PR-blocking path).
#
# NOTE: this workflow was authored and code-reviewed but not run in CI
# (no device/emulator access in the environment that wrote it — same caveat
# as docs/accessibility/mobile-audit.md). Whoever merges it should trigger
# it once via `workflow_dispatch` and expect to iterate on the `e2e` job in
# particular — Android emulator boot + Expo build steps in CI are exactly
# the kind of thing that needs one real run to shake out.

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/react-mobile/**'
      - '.github/workflows/react-mobile.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/react-mobile/**'
      - '.github/workflows/react-mobile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'

defaults:
  run:
    working-directory: apps/react-mobile

jobs:
  quality:
    name: Lint · Typecheck · Test · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/react-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # coverageThreshold in jest.config.js (60% on all four metrics) already
      # fails this step if coverage regresses — no separate gate script
      # needed, unlike Flutter's lcov-based one in flutter.yml.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: react-mobile-coverage-html
          path: apps/react-mobile/coverage
          retention-days: 14

  # Off the PR-blocking path for the same reason Playwright is in ci.yml,
  # only more so: this needs a booted Android emulator, which is slower and
  # flakier than anything in the `quality` job. Runs only when a PR carries
  # the "run-e2e" label.
  e2e:
    name: End-to-end (Maestro, Android)
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.event_name == 'workflow_dispatch'
    needs: quality
    # Hosted `ubuntu-latest` runners have no hardware-accelerated
    # virtualization for the Android emulator; macOS runners do.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/react-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS deps
        run: npm ci

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Boot emulator, build the app, and run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # No Play Store needed; keeps boot faster.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/react-mobile
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            npx expo run:android --no-build-cache --variant debug
            maestro test e2e/

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            apps/react-mobile/.maestro/**
            ~/.maestro/tests/**
          retention-days: 7
          if-no-files-found: ignore
