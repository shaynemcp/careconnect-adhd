name: React Native mobile

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/react-mobile/**'
      - '.github/workflows/react-mobile.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/react-mobile/**'
      - '.github/workflows/react-mobile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'

# apps/react-mobile is deliberately NOT a root workspace: adding it would pull
# the Expo dependency tree into the root lockfile for everyone building only
# the web or desktop app. It carries its own package-lock.json instead, so
# every step here runs inside the app directory against that lockfile.
defaults:
  run:
    working-directory: apps/react-mobile

jobs:
  quality:
    name: Lint · Typecheck · Test (react-mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/react-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

      # jest.config.js carries the 60% statements/branches/functions/lines
      # thresholds (Assignment 4), so --coverage is what enforces them:
      # a plain `npm test` run would pass below the floor.
      - name: Unit tests with coverage
        run: npx jest --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-mobile-coverage-html
          path: apps/react-mobile/coverage
          retention-days: 14

  bundle:
    name: Expo doctor · Android bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/react-mobile/package-lock.json

      - name: Install
        run: npm ci

      # Advisory, not blocking. Two of expo-doctor's 21 checks call external
      # services (the Expo config schema and the React Native Directory API),
      # so a service hiccup would fail this job for a reason that has nothing
      # to do with the diff — the same argument that keeps Playwright off the
      # PR-blocking path in ci.yml. The report still shows up in the log.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: npx --yes expo-doctor

      # Not a release build (that needs EAS credentials) — this is a smoke
      # test that the app's whole import graph actually bundles for a device,
      # which the Jest suite cannot tell us.
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: react-mobile-android-bundle
          path: apps/react-mobile/dist
          retention-days: 7

  # Off the PR-blocking path for the same reason Playwright is in ci.yml,
  # only more so: this needs a booted Android emulator, which is slower and
  # flakier than anything in the `quality` job. Runs only when a PR carries
  # the "run-e2e" label.
  #
  # NOTE: authored and code-reviewed but not run in CI yet (no device/emulator
  # access in the environment that wrote it). Whoever first triggers it via
  # `workflow_dispatch` should expect to iterate — Android emulator boot +
  # Expo build steps in CI are exactly the kind of thing that needs one real
  # run to shake out.
  e2e:
    name: End-to-end (Maestro, Android)
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.event_name == 'workflow_dispatch'
    needs: quality
    # Hosted `ubuntu-latest` runners have no hardware-accelerated
    # virtualization for the Android emulator; macOS runners do.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/react-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS deps
        run: npm ci

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Boot emulator, build the app, and run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # No Play Store needed; keeps boot faster.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/react-mobile
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            npx expo run:android --no-build-cache --variant debug
            maestro test e2e/

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            apps/react-mobile/.maestro/**
            ~/.maestro/tests/**
          retention-days: 7
          if-no-files-found: ignore
